name: Pages

# Publishes the website in docs/ to GitHub Pages whenever it changes on main.
# The first run turns Pages on for the repository (source: GitHub Actions);
# nothing to click in the settings. The site then lives at
# https://costardrouge.github.io/metube-extension/
on:
  push:
    branches: [main]
    paths: ['docs/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy docs/
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs

      - id: deploy
        uses: actions/deploy-pages@v4
