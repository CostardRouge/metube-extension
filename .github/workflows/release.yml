name: Release

# Versions and releases (COMMON-PROJECT-SPEC, C13), identical in every repo: copy it with .github/release.mjs.
# On a pull request, `check` refuses a CHANGELOG.md that disagrees with package.json's version or breaks its shape.
# On main, `publish` gives every CHANGELOG section that has none its tag v<version> and its GitHub Release: the
# release pull request's merge commit for package.json's version, the named commit for a backfilled one. Merging a
# pull request that does not bump the version publishes nothing.
# A backfilled tag points at an older commit, whose .github/workflows differ from main's: GitHub refuses that to the
# workflow's own token, so backfills are skipped here with a warning and published by second-brain's "Backfill
#
# This repository's own addition, after C13's identical part: the extension's zip. The old tag-triggered release
# workflow cannot run any more (a tag or Release made with the workflow's GITHUB_TOKEN triggers no other workflow),
# so the zip is built here, in the same job: every Release vX.Y.Z without its metube-sender-X.Y.Z.zip gets it, built
# from its own tag by scripts/build.sh with that version written into the zip's manifest.json. A backfilled Release
# published by second-brain gets its zip on the next push to main, or on "Run workflow". v1 to v4 predate SemVer and
# carry their zips already; a pre-release is not a version Chrome accepts, so it gets none.
# releases" workflow, which holds the maintainer's token. "Run workflow" re-runs publish on main by hand.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - run: node .github/release.mjs check

  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - run: node .github/release.mjs publish
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Attach the extension zip to every release that lacks it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --tags --force --quiet
          mapfile -t missing < <(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" --jq '.[]
            | .tag_name as $tag
            | select($tag | test("^v[0-9]+\\.[0-9]+\\.[0-9]+$"))
            | select([.assets[].name] | index("metube-sender-\($tag[1:]).zip") | not)
            | $tag')
          for tag in "${missing[@]}"; do
            version=${tag#v}
            dir="$RUNNER_TEMP/$tag"
            git worktree add --quiet --detach "$dir" "$tag"
            zip=$("$dir/scripts/build.sh" "$version")
            (cd "$dir/dist" && sha256sum "${zip##*/}" > "${zip##*/}.sha256")
            gh release upload "$tag" "$dir/$zip" "$dir/$zip.sha256" --clobber
            echo "Attached ${zip##*/} to $tag."
          done
